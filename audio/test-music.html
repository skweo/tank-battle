<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>BGM Test</title>
<style>
  body { background:#0a0e14; color:#ccc; font-family:'Segoe UI',sans-serif; text-align:center; padding:40px; }
  button { margin:8px; padding:12px 24px; font-size:14px; cursor:pointer; border:1px solid #444; background:#1a1e28; color:#ddd; border-radius:4px; }
  button:hover { background:#2a2e38; }
  button.active { border-color:#f49800; color:#f49800; }
  .info { color:#888; font-size:12px; margin-top:20px; }
</style></head><body>
<h2>BGM Test Panel</h2>
<div id="btns">
  <button onclick="play('menu')">Menu</button>
  <button onclick="play('combat')">Combat (wave1)</button>
  <button onclick="play('combat_high')">Combat (wave15)</button>
  <button onclick="play('boss')">Boss</button>
  <button onclick="stop()">Stop</button>
</div>
<div class="info">Click any button (browser needs user gesture for audio)</div>
<script src="music-generator.js"></script>
<script>
let ms;
function ensure() {
  if (ms) return;
  const ctx = new (window.AudioContext||window.webkitAudioContext)();
  ms = new CyberSynth(ctx);
  ms.start();
}
function play(mode) {
  ensure();
  if (mode==='combat') ms.switchMode('combat', 1);
  else if (mode==='combat_high') ms.switchMode('combat', 15);
  else if (mode==='boss') ms.switchMode('boss', 8);
  else ms.switchMode('menu');
  document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
}
function stop() { if(ms) ms.stop(); ms=null; }
</script>
</body></html>
