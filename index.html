<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 - Tank Battle</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  user-select: none;
}
#game-container {
  position: relative;
  border: 3px solid #444;
  box-shadow: 0 0 30px rgba(0,150,0,0.3);
}
canvas {
  display: block;
  background: #1a1a1a;
}
#ui {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  padding: 12px 20px;
  color: #0f0;
  font-size: 16px;
  font-weight: bold;
  pointer-events: none;
}
#ui span { text-shadow: 0 0 8px rgba(0,255,0,0.6); }
#game-over {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  pointer-events: none;
}
#game-over.visible { display: flex; }
#game-over h1 {
  color: #f44;
  font-size: 48px;
  text-shadow: 0 0 20px rgba(255,0,0,0.7);
}
#game-over p { color: #ff0; font-size: 20px; }
#game-over button {
  pointer-events: all;
  padding: 12px 32px;
  font-size: 18px;
  background: #0a0;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-family: 'Courier New', monospace;
  font-weight: bold;
  letter-spacing: 2px;
}
#game-over button:hover { background: #0c0; }
#start-screen {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 24px;
  background: rgba(0,0,0,0.85);
  z-index: 10;
}
#start-screen h1 {
  color: #0f0;
  font-size: 52px;
  text-shadow: 0 0 30px rgba(0,255,0,0.8), 0 0 60px rgba(0,255,0,0.4);
  letter-spacing: 6px;
  margin-bottom: 8px;
}
#start-screen .subtitle {
  color: #888;
  font-size: 14px;
  letter-spacing: 4px;
  margin-top: -16px;
}
#start-screen .difficulty-buttons {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-top: 12px;
}
#start-screen .diff-btn {
  padding: 14px 60px;
  font-size: 20px;
  font-family: 'Courier New', monospace;
  font-weight: bold;
  letter-spacing: 3px;
  border: 2px solid #0a0;
  border-radius: 8px;
  cursor: pointer;
  color: #0f0;
  background: rgba(0,100,0,0.15);
  transition: all 0.2s;
}
#start-screen .diff-btn:hover {
  background: rgba(0,180,0,0.3);
  box-shadow: 0 0 20px rgba(0,255,0,0.4);
  transform: scale(1.05);
}
#start-screen .diff-btn.easy { border-color: #0a0; color: #4f4; }
#start-screen .diff-btn.normal { border-color: #da0; color: #ff4; }
#start-screen .diff-btn.hard { border-color: #d40; color: #f66; }
#start-screen .diff-btn.hard:hover { box-shadow: 0 0 20px rgba(255,0,0,0.4); }
#start-screen .diff-info {
  color: #666;
  font-size: 11px;
  letter-spacing: 1px;
  text-align: center;
  line-height: 1.6;
}
#instructions {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  color: #888;
  font-size: 12px;
  pointer-events: none;
  text-align: center;
}
#achieve-toast {
  position: absolute;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.9);
  border: 2px solid #da0;
  border-radius: 10px;
  padding: 12px 24px;
  color: #ff0;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 2px;
  display: none;
  z-index: 20;
  pointer-events: none;
  text-align: center;
  animation: toastIn 0.4s ease-out;
  box-shadow: 0 0 20px rgba(255,200,0,0.5);
}
#achieve-toast .achieve-icon { font-size: 28px; display: block; }
#achieve-toast .achieve-label { color: #888; font-size: 11px; }
@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
#achievements-screen {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.9);
  z-index: 15;
  display: none;
  flex-direction: column;
  align-items: center;
  padding: 30px 40px;
  overflow-y: auto;
}
#achievements-screen h1 {
  color: #da0;
  font-size: 36px;
  letter-spacing: 4px;
  margin-bottom: 20px;
  text-shadow: 0 0 20px rgba(200,170,0,0.6);
}
#achievements-screen .achieve-grid {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
  max-width: 500px;
}
#achievements-screen .achieve-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 16px;
  border-radius: 8px;
  border: 2px solid #333;
  background: rgba(30,30,30,0.8);
}
#achievements-screen .achieve-row.unlocked {
  border-color: #da0;
  background: rgba(40,35,0,0.6);
  box-shadow: 0 0 10px rgba(200,170,0,0.2);
}
#achievements-screen .achieve-row .ach-icon {
  font-size: 28px;
  width: 40px;
  text-align: center;
  flex-shrink: 0;
}
#achievements-screen .achieve-row.locked .ach-icon {
  filter: grayscale(1);
  opacity: 0.3;
}
#achievements-screen .achieve-row .ach-info {
  flex: 1;
}
#achievements-screen .achieve-row .ach-name {
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 2px;
}
#achievements-screen .achieve-row.locked .ach-name { color: #666; }
#achievements-screen .achieve-row .ach-desc {
  color: #888;
  font-size: 12px;
  margin-top: 2px;
}
#achievements-screen .achieve-row.locked .ach-desc { color: #444; }
#achievements-screen .ach-back-btn {
  margin-top: 24px;
  padding: 12px 40px;
  font-size: 18px;
  font-family: 'Courier New', monospace;
  font-weight: bold;
  letter-spacing: 3px;
  border: 2px solid #da0;
  border-radius: 8px;
  cursor: pointer;
  color: #ff0;
  background: rgba(100,80,0,0.2);
  transition: all 0.2s;
}
#achievements-screen .ach-back-btn:hover {
  background: rgba(150,120,0,0.4);
  box-shadow: 0 0 20px rgba(200,170,0,0.4);
}
#start-screen .achieve-link {
  color: #888;
  font-size: 13px;
  cursor: pointer;
  letter-spacing: 2px;
  border-bottom: 1px dashed #555;
  transition: color 0.2s;
}
#start-screen .achieve-link:hover { color: #da0; border-color: #da0; }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="game"></canvas>
  <div id="ui">
    <span>💥 <span id="score">0</span></span>
    <span>❤️ <span id="lives">3</span></span>
    <span>🏆 <span id="level">1</span></span>
  </div>
  <div id="game-over">
    <h1>游戏结束</h1>
    <p>最终得分: <span id="final-score">0</span></p>
    <button onclick="restartGame()">重新开始</button>
  </div>
  <div id="achieve-toast">
    <span class="achieve-icon"></span>
    <span class="achieve-name"></span>
    <span class="achieve-label">成就已解锁!</span>
  </div>
  <div id="start-screen">
    <h1>坦 克 大 战</h1>
    <p class="subtitle">T A N K &nbsp; B A T T L E</p>
    <div class="difficulty-buttons">
      <button class="diff-btn easy" onclick="startGame('easy')">简单</button>
      <button class="diff-btn normal" onclick="startGame('normal')">普通</button>
      <button class="diff-btn hard" onclick="startGame('hard')">困难</button>
    </div>
    <p class="diff-info">简单: 5条命 · 敌人较弱<br>普通: 3条命 · 标准难度<br>困难: 2条命 · 敌人更强</p>
    <p class="achieve-link" onclick="showAchievements()">🏆 查看成就</p>
  </div>
  <div id="achievements-screen">
    <h1>🏆 成 就</h1>
    <div class="achieve-grid" id="achieve-grid"></div>
    <button class="ach-back-btn" onclick="hideAchievements()">返回</button>
  </div>
  <div id="instructions">WASD 移动 | 鼠标瞄准 | 左键射击 | R 重新开始</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = 780;
const H = 580;
canvas.width = W;
canvas.height = H;

// --- Game State ---
let score = 0;
let lives = 3;
let level = 1;
let gameRunning = true;
let gameOverFlag = false;
let currentDifficulty = 'normal';

// --- Difficulty Settings ---
const difficultySettings = {
  easy:   { lives: 5, spawnRate: 280, enemyHpBonus: -1, playerHp: 6, enemySpeedMul: 0.75, label: '简单' },
  normal: { lives: 3, spawnRate: 240, enemyHpBonus: 0,  playerHp: 5, enemySpeedMul: 1.0,  label: '普通' },
  hard:   { lives: 2, spawnRate: 180, enemyHpBonus: 1,  playerHp: 4, enemySpeedMul: 1.3,  label: '困难' },
};

// --- Achievements ---
const achievementsDef = [
  { id: 'first_blood', name: '首次击杀', desc: '消灭第一个敌人', icon: '🎯' },
  { id: 'sharpshooter', name: '百发百中', desc: '累计消灭10个敌人', icon: '🔫' },
  { id: 'tank_hunter', name: '坦克杀手', desc: '累计消灭50个敌人', icon: '💥' },
  { id: 'battle_veteran', name: '战斗老兵', desc: '累计消灭100个敌人', icon: '🏅' },
  { id: 'survivor', name: '生存专家', desc: '到达第5关', icon: '🛡️' },
  { id: 'tenacious', name: '顽强战士', desc: '到达第10关', icon: '⚔️' },
  { id: 'score_500', name: '初露锋芒', desc: '单局得分达到500', icon: '⭐' },
  { id: 'score_2000', name: '高分玩家', desc: '单局得分达到2000', icon: '🌟' },
  { id: 'score_5000', name: '积分之王', desc: '单局得分达到5000', icon: '👑' },
  { id: 'hardcore', name: '硬核玩家', desc: '困难难度到达第5关', icon: '💀' },
  { id: 'flawless', name: '无伤过关', desc: '一关内未受任何伤害', icon: '✨' },
];

const STORAGE_KEY = 'tankbattle_achievements';
let unlockedAchievements = new Set();

function loadAchievements() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) unlockedAchievements = new Set(JSON.parse(raw));
  } catch(e) { unlockedAchievements = new Set(); }
}

function saveAchievements() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...unlockedAchievements]));
  } catch(e) {}
}

function unlockAchievement(id) {
  if (unlockedAchievements.has(id)) return;
  unlockedAchievements.add(id);
  saveAchievements();
  const def = achievementsDef.find(a => a.id === id);
  if (!def) return;
  const toast = document.getElementById('achieve-toast');
  toast.querySelector('.achieve-icon').textContent = def.icon;
  toast.querySelector('.achieve-name').textContent = def.name;
  toast.style.display = 'block';
  toast.style.animation = 'none';
  toast.offsetHeight;
  toast.style.animation = 'toastIn 0.4s ease-out';
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => { toast.style.display = 'none'; }, 3000);
}

// --- Achievement tracking ---
let sessionKills = 0;
let gotHitThisLevel = false;

function checkAchievements() {
  if (sessionKills >= 1) unlockAchievement('first_blood');
  if (sessionKills >= 10) unlockAchievement('sharpshooter');
  if (sessionKills >= 50) unlockAchievement('tank_hunter');
  if (sessionKills >= 100) unlockAchievement('battle_veteran');
  if (level >= 5) unlockAchievement('survivor');
  if (level >= 10) unlockAchievement('tenacious');
  if (score >= 500) unlockAchievement('score_500');
  if (score >= 2000) unlockAchievement('score_2000');
  if (score >= 5000) unlockAchievement('score_5000');
  if (currentDifficulty === 'hard' && level >= 5) unlockAchievement('hardcore');
}

function onLevelUp() {
  if (!gotHitThisLevel) unlockAchievement('flawless');
  gotHitThisLevel = false;
}

function resetAchievementTracking() {
  sessionKills = 0;
  gotHitThisLevel = false;
}

// --- Power-ups ---
const powerUpDefs = [
  { type: 'speed',    name: '加强履带', icon: '⚡', color: '#4af', desc: '移速×1.2', duration: 600 },
  { type: 'railgun',  name: '电磁炮',   icon: '🔫', color: '#a4f', desc: '穿透脉冲', duration: 480 },
  { type: 'ricochet', name: '反弹弹',   icon: '💫', color: '#fa4', desc: '子弹弹射', duration: 600 },
  { type: 'shield',   name: '能量护盾', icon: '🛡️', color: '#4ff', desc: '临时无敌', duration: 300 },
  { type: 'rapid',    name: '急速连射', icon: '🔥', color: '#f44', desc: '射速翻倍', duration: 420 },
  { type: 'repair',   name: '维修工具', icon: '🔧', color: '#4f4', desc: '恢复1HP', duration: 0 },
  { type: 'freeze',   name: '冰冻弹',   icon: '❄️', color: '#8cf', desc: '减缓敌人', duration: 360 },
  { type: 'multishot',name: '散射炮',   icon: '💥', color: '#f8f', desc: '三发散射', duration: 540 },
];

const powerUps = [];
let powerUpSpawnTimer = 0;

// Active buffs (duration in frames, 0 = inactive)
let buffs = {
  speed: 0, railgun: 0, ricochet: 0, shield: 0,
  rapid: 0, freeze: 0, multishot: 0,
};

function spawnPowerUp(x, y) {
  const def = powerUpDefs[Math.floor(Math.random() * powerUpDefs.length)];
  // Don't spawn inside obstacles
  if (tankCollidesObstacle(x, y, 20, 20)) return;
  powerUps.push({
    x: x, y: y, type: def.type, name: def.name,
    icon: def.icon, color: def.color, duration: def.duration,
    life: 600, // despawn after 10 seconds
  });
}

function applyPowerUp(p) {
  if (p.type === 'repair') {
    player.hp = Math.min(player.hp + 1, player.maxHp);
    return;
  }
  buffs[p.type] = p.duration;
  const def = powerUpDefs.find(d => d.type === p.type);
  if (def) {
    const toast = document.getElementById('achieve-toast');
    toast.querySelector('.achieve-icon').textContent = def.icon;
    toast.querySelector('.achieve-name').textContent = '获得: ' + def.name;
    toast.querySelector('.achieve-label').textContent = def.desc;
    toast.style.display = 'block';
    toast.style.animation = 'none';
    toast.offsetHeight;
    toast.style.animation = 'toastIn 0.4s ease-out';
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => { toast.style.display = 'none'; }, 2000);
  }
}

function getEffectiveSpeed() {
  return player.speed * (buffs.speed > 0 ? 1.2 : 1);
}

function getEffectiveShootDelay() {
  return buffs.rapid > 0 ? Math.floor(player.shootDelay / 2) : player.shootDelay;
}

function renderAchievements() {
  const grid = document.getElementById('achieve-grid');
  grid.innerHTML = achievementsDef.map(a => {
    const unlocked = unlockedAchievements.has(a.id);
    return `<div class="achieve-row ${unlocked ? 'unlocked' : 'locked'}">
      <span class="ach-icon">${unlocked ? a.icon : '🔒'}</span>
      <div class="ach-info">
        <div class="ach-name">${a.name}</div>
        <div class="ach-desc">${unlocked ? a.desc : '???'}</div>
      </div>
    </div>`;
  }).join('');
}

function showAchievements() {
  renderAchievements();
  document.getElementById('achievements-screen').style.display = 'flex';
  document.getElementById('start-screen').style.display = 'none';
}

function hideAchievements() {
  document.getElementById('achievements-screen').style.display = 'none';
  document.getElementById('start-screen').style.display = 'flex';
}

// --- Input ---
const keys = {};
let mouse = { x: W/2, y: H/2 };
let mouseDown = false;

window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === 'r') restartGame();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});
canvas.addEventListener('mousedown', e => { if (e.button === 0) mouseDown = true; });
canvas.addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// --- Particles ---
const particles = [];
class Particle {
  constructor(x, y, color, speed) {
    this.x = x; this.y = y;
    this.vx = (Math.random() - 0.5) * speed;
    this.vy = (Math.random() - 0.5) * speed;
    this.life = 1;
    this.decay = 0.02 + Math.random() * 0.04;
    this.color = color;
    this.radius = 1.5 + Math.random() * 2.5;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }
  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function spawnExplosion(x, y, count, color1, color2) {
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(x, y, Math.random() < 0.5 ? color1 : color2, 3 + Math.random() * 5));
  }
}

// --- Bullets ---
class Bullet {
  constructor(x, y, angle, speed, color, fromPlayer) {
    this.x = x; this.y = y;
    this.angle = angle;
    this.speed = speed;
    this.color = color;
    this.fromPlayer = fromPlayer;
    this.radius = 3;
    this.alive = true;
    this.ricochet = false;
    this.railgun = false;
    this.freeze = false;
    this.bounces = 0;
  }
  update() {
    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;

    // Ricochet off walls
    if (this.ricochet && this.bounces > 0) {
      let bounced = false;
      if (this.x < 5) { this.x = 5; this.angle = Math.PI - this.angle; bounced = true; }
      if (this.x > W - 5) { this.x = W - 5; this.angle = Math.PI - this.angle; bounced = true; }
      if (this.y < 5) { this.y = 5; this.angle = -this.angle; bounced = true; }
      if (this.y > H - 5) { this.y = H - 5; this.angle = -this.angle; bounced = true; }
      if (bounced) this.bounces--;
    }

    if (this.x < -20 || this.x > W + 20 || this.y < -20 || this.y > H + 20) {
      this.alive = false;
    }
  }
  draw(ctx) {
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = this.railgun ? 12 : 6;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    if (this.railgun) {
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 2;
      ctx.shadowColor = this.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(this.x - Math.cos(this.angle) * 12, this.y - Math.sin(this.angle) * 12);
      ctx.lineTo(this.x, this.y);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }
}

// --- Tanks ---
class Tank {
  constructor(x, y, color, turretColor, speed, hp) {
    this.x = x; this.y = y;
    this.width = 36; this.height = 36;
    this.color = color;
    this.turretColor = turretColor;
    this.speed = speed;
    this.hp = hp;
    this.maxHp = hp;
    this.turretAngle = 0;
    this.alive = true;
    this.shootCooldown = 0;
    this.shootDelay = 40;
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);

    // Tracks
    ctx.fillStyle = '#222';
    ctx.fillRect(-19, -14, 6, 28);
    ctx.fillRect(13, -14, 6, 28);

    // Track treads
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    for (let i = -12; i < 14; i += 5) {
      ctx.beginPath();
      ctx.moveTo(-18, i); ctx.lineTo(-14, i); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(14, i); ctx.lineTo(18, i); ctx.stroke();
    }

    // Body
    ctx.fillStyle = this.color;
    ctx.fillRect(-15, -12, 30, 24);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.strokeRect(-15, -12, 30, 24);

    // Body detail
    ctx.fillStyle = this.darken(this.color, 0.7);
    ctx.fillRect(-10, -8, 20, 16);

    // Turret base
    ctx.fillStyle = this.turretColor;
    ctx.beginPath();
    ctx.arc(0, 0, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Turret barrel
    ctx.save();
    ctx.rotate(this.turretAngle);
    ctx.fillStyle = this.turretColor;
    ctx.fillRect(3, -3, 16, 6);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(3, -3, 16, 6);
    ctx.restore();

    // HP bar
    if (this.hp < this.maxHp) {
      const barW = 30;
      const barH = 4;
      ctx.fillStyle = '#400';
      ctx.fillRect(-barW/2, -24, barW, barH);
      ctx.fillStyle = '#0f0';
      ctx.fillRect(-barW/2, -24, barW * (this.hp / this.maxHp), barH);
    }

    ctx.restore();
  }
  darken(color, factor) {
    const r = parseInt(color.slice(1,3), 16) * factor;
    const g = parseInt(color.slice(3,5), 16) * factor;
    const b = parseInt(color.slice(5,7), 16) * factor;
    return `rgb(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)})`;
  }
}

class PlayerTank extends Tank {
  constructor() {
    super(W/2, H - 60, '#4a8', '#3c6', 1.4, difficultySettings[currentDifficulty].playerHp);
    this.shootDelay = 25;
    this.invincible = 0;
  }
  update() {
    if (!this.alive) return;
    if (this.invincible > 0) this.invincible--;
    if (buffs.shield > 0) this.invincible = Math.max(this.invincible, 2);
    if (this.shootCooldown > 0) this.shootCooldown--;

    let dx = 0, dy = 0;
    if (keys['w'] || keys['arrowup']) dy = -1;
    if (keys['s'] || keys['arrowdown']) dy = 1;
    if (keys['a'] || keys['arrowleft']) dx = -1;
    if (keys['d'] || keys['arrowright']) dx = 1;

    if (dx !== 0 && dy !== 0) {
      dx *= 0.707;
      dy *= 0.707;
    }

    const effSpeed = getEffectiveSpeed();
    const newX = this.x + dx * effSpeed;
    const newY = this.y + dy * effSpeed;
    if (newX > 25 && newX < W - 25 && !tankCollidesObstacle(newX, this.y, 36, 36)) this.x = newX;
    if (newY > 25 && newY < H - 25 && !tankCollidesObstacle(this.x, newY, 36, 36)) this.y = newY;

    // Turret aims at mouse
    this.turretAngle = Math.atan2(mouse.y - this.y, mouse.x - this.x);

    // Shoot
    if ((mouseDown || keys[' '] || keys['j']) && this.shootCooldown <= 0) {
      this.shoot();
      this.shootCooldown = getEffectiveShootDelay();
    }
  }
  shoot() {
    const bx = this.x + Math.cos(this.turretAngle) * 18;
    const by = this.y + Math.sin(this.turretAngle) * 18;
    const baseSpeed = buffs.railgun > 0 ? 8 : 4;
    const baseColor = buffs.railgun > 0 ? '#a4f' : (buffs.freeze > 0 ? '#8cf' : '#ff0');
    const baseRadius = buffs.railgun > 0 ? 5 : 3;
    if (buffs.multishot > 0) {
      for (let a = -0.12; a <= 0.12; a += 0.12) {
        const b = new Bullet(bx, by, this.turretAngle + a, baseSpeed, baseColor, true);
        b.radius = baseRadius;
        b.ricochet = buffs.ricochet > 0;
        b.railgun = buffs.railgun > 0;
        b.freeze = buffs.freeze > 0;
        b.bounces = buffs.ricochet > 0 ? 3 : 0;
        playerBullets.push(b);
      }
    } else {
      const b = new Bullet(bx, by, this.turretAngle, baseSpeed, baseColor, true);
      b.radius = baseRadius;
      b.ricochet = buffs.ricochet > 0;
      b.railgun = buffs.railgun > 0;
      b.freeze = buffs.freeze > 0;
      b.bounces = buffs.ricochet > 0 ? 3 : 0;
      playerBullets.push(b);
    }
  }
  draw(ctx) {
    if (this.invincible > 0 && Math.floor(this.invincible / 4) % 2 === 0) return;
    ctx.save();
    if (buffs.shield > 0) {
      ctx.shadowColor = '#4ff';
      ctx.shadowBlur = 14;
    }
    super.draw(ctx);
    // Buff indicator dots
    const activeBuffs = [];
    if (buffs.speed > 0) activeBuffs.push({icon:'⚡',c:'#4af'});
    if (buffs.railgun > 0) activeBuffs.push({icon:'🔫',c:'#a4f'});
    if (buffs.ricochet > 0) activeBuffs.push({icon:'💫',c:'#fa4'});
    if (buffs.shield > 0) activeBuffs.push({icon:'🛡️',c:'#4ff'});
    if (buffs.rapid > 0) activeBuffs.push({icon:'🔥',c:'#f44'});
    if (buffs.freeze > 0) activeBuffs.push({icon:'❄️',c:'#8cf'});
    if (buffs.multishot > 0) activeBuffs.push({icon:'💥',c:'#f8f'});
    for (let i = 0; i < activeBuffs.length; i++) {
      ctx.font = '12px sans-serif';
      ctx.fillStyle = activeBuffs[i].c;
      ctx.fillText(activeBuffs[i].icon, -18 + i * 14, -28);
    }
    ctx.restore();
  }
  hit() {
    if (this.invincible > 0 || buffs.shield > 0) return false;
    this.hp--;
    this.invincible = 60;
    gotHitThisLevel = true;
    spawnExplosion(this.x, this.y, 8, '#f80', '#ff0');
    if (this.hp <= 0) {
      this.alive = false;
      spawnExplosion(this.x, this.y, 30, '#f44', '#f80');
      return true;
    }
    return false;
  }
}

class EnemyTank extends Tank {
  constructor(x, y, color, turretColor, speed, hp) {
    super(x, y, color, turretColor, speed, hp);
    this.aiTimer = Math.random() * 60;
    this.moveDir = Math.random() < 0.5 ? -1 : 1;
    this.moveAxis = Math.random() < 0.5 ? 'x' : 'y';
    this.aiChangeTime = 40 + Math.random() * 80;
    this.shootDelay = 90 + Math.random() * 60;
    this.frozen = 0;
    this._origSpeed = speed;
    this.armor = false;
    this.isElite = false;
  }
  update() {
    if (!this.alive) return;
    if (this.shootCooldown > 0) this.shootCooldown--;
    if (this.frozen > 0) {
      this.frozen--;
      this.speed = this._origSpeed * 0.4;
      if (this.frozen <= 0) this.speed = this._origSpeed;
    }

    this.aiTimer++;

    // Movement AI
    if (this.aiTimer % this.aiChangeTime < 2) {
      this.moveDir = Math.random() < 0.5 ? -1 : 1;
      this.moveAxis = Math.random() < 0.5 ? 'x' : 'y';
      this.aiChangeTime = 40 + Math.random() * 80;
    }

    // Chase player
    const dx = player.x - this.x;
    const dy = player.y - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    // Turret aim at player
    this.turretAngle = Math.atan2(dy, dx);

    // Move
    let moveX = 0, moveY = 0;
    const chaseThreshold = 200;
    if (dist < chaseThreshold) {
      moveX = (dx / dist) * 0.5;
      moveY = (dy / dist) * 0.5;
    }
    if (this.moveAxis === 'x') moveX += this.moveDir * 0.5;
    else moveY += this.moveDir * 0.5;

    const newX = this.x + moveX * this.speed;
    const newY = this.y + moveY * this.speed;
    if (newX > 25 && newX < W - 25 && !tankCollidesObstacle(newX, this.y, 36, 36)) this.x = newX;
    else this.moveDir *= -1;
    if (newY > 25 && newY < H - 25 && !tankCollidesObstacle(this.x, newY, 36, 36)) this.y = newY;
    else this.moveDir *= -1;

    // Shoot at player
    if (this.shootCooldown <= 0 && dist < 350) {
      this.shoot();
      this.shootCooldown = this.shootDelay;
    }

    // Collision with player
    if (dist < 32) {
      this.hp = 0;
      this.alive = false;
      spawnExplosion(this.x, this.y, 20, '#f80', '#ff0');
      if (!player.hit()) {
        player.hp = 0;
        player.alive = false;
      }
    }
  }
  draw(ctx) {
    if (this.frozen > 0) {
      ctx.save();
      ctx.shadowColor = '#8cf';
      ctx.shadowBlur = 10;
    }
    super.draw(ctx);
    if (this.frozen > 0) ctx.restore();
  }
  shoot() {
    const bx = this.x + Math.cos(this.turretAngle) * 18;
    const by = this.y + Math.sin(this.turretAngle) * 18;
    const spread = (Math.random() - 0.5) * 0.15;
    enemyBullets.push(new Bullet(bx, by, this.turretAngle + spread, 2.5, '#f44', false));
  }
  hit(bullet) {
    if (this.armor && Math.random() < 0.4) {
      spawnExplosion(this.x, this.y, 3, '#888', '#aaa');
      return false;
    }
    this.hp--;
    if (bullet && bullet.freeze && !this.frozen) {
      this.frozen = 120;
      this._origSpeed = this.speed;
      spawnExplosion(this.x, this.y, 8, '#8cf', '#fff');
    }
    spawnExplosion(this.x, this.y, 5, '#f80', '#ff0');
    if (this.hp <= 0) {
      this.alive = false;
      spawnExplosion(this.x, this.y, 20, '#f80', '#f44');
      const points = this.isElite ? 300 : 100;
      score += points;
      sessionKills++;
      checkAchievements();
      if (this.isElite && Math.random() < 0.7) {
        spawnPowerUp(this.x, this.y);
      }
    }
    return !this.alive;
  }
}

// --- Elite Enemies ---
const eliteTypes = [
  { name: '重装坦克', color: '#633', turret: '#c44', speed: 0.4, hp: 6, special: 'heavy', icon: '🛡️' },
  { name: '狙击坦克', color: '#363', turret: '#6c6', speed: 0.5, hp: 3, special: 'sniper', icon: '🎯' },
  { name: '疾风坦克', color: '#336', turret: '#66c', speed: 1.4, hp: 2, special: 'fast', icon: '💨' },
  { name: '火焰坦克', color: '#633', turret: '#c63', speed: 0.5, hp: 4, special: 'flame', icon: '🔥' },
  { name: '召唤坦克', color: '#366', turret: '#6c6', speed: 0.4, hp: 5, special: 'summoner', icon: '📡' },
];

class EliteEnemy extends EnemyTank {
  constructor(x, y, eliteDef) {
    const diff = difficultySettings[currentDifficulty];
    const hp = eliteDef.hp + Math.floor(level / 3) + diff.enemyHpBonus;
    super(x, y, eliteDef.color, eliteDef.turret, eliteDef.speed * diff.enemySpeedMul, Math.max(2, hp));
    this.isElite = true;
    this.armor = eliteDef.special === 'heavy';
    this.special = eliteDef.special;
    this.eliteIcon = eliteDef.icon;
    this.eliteName = eliteDef.name;
    this.shootDelay = 60 + Math.random() * 40;
    if (eliteDef.special === 'sniper') {
      this.shootDelay = 40 + Math.random() * 30;
    }
    if (eliteDef.special === 'summoner') {
      this.summonCooldown = 120 + Math.random() * 120;
    }
  }
  update() {
    super.update();
    if (!this.alive) return;
    // Summoner spawns minions
    if (this.special === 'summoner' && this.summonCooldown > 0) {
      this.summonCooldown--;
      if (this.summonCooldown <= 0) {
        this.summonCooldown = 200 + Math.random() * 150;
        spawnEnemy();
      }
    }
  }
  shoot() {
    if (this.special === 'flame') {
      for (let a = -0.2; a <= 0.2; a += 0.2) {
        const bx = this.x + Math.cos(this.turretAngle + a) * 18;
        const by = this.y + Math.sin(this.turretAngle + a) * 18;
        enemyBullets.push(new Bullet(bx, by, this.turretAngle + a, 2.5, '#f84', false));
      }
    } else if (this.special === 'sniper') {
      const bx = this.x + Math.cos(this.turretAngle) * 18;
      const by = this.y + Math.sin(this.turretAngle) * 18;
      enemyBullets.push(new Bullet(bx, by, this.turretAngle, 5, '#6f6', false));
    } else {
      super.shoot();
    }
  }
  draw(ctx) {
    ctx.save();
    ctx.shadowColor = '#ff0';
    ctx.shadowBlur = 8 + Math.sin(Date.now() / 200) * 3;
    super.draw(ctx);
    // Elite star
    ctx.font = '14px sans-serif';
    ctx.fillStyle = '#ff0';
    ctx.shadowBlur = 0;
    ctx.fillText(this.eliteIcon, -7, -28);
    ctx.restore();
  }
}

// --- Game objects ---
let player;
let enemies = [];
let playerBullets = [];
let enemyBullets = [];
let spawnTimer = 0;
let difficultyTimer = 0;
const obstacles = [];

// --- Obstacles ---
function generateObstacles() {
  obstacles.length = 0;
  const count = 6 + level * 2;
  for (let i = 0; i < count; i++) {
    obstacles.push({
      x: 40 + Math.random() * (W - 80),
      y: 40 + Math.random() * (H - 80),
      w: 30 + Math.random() * 40,
      h: 30 + Math.random() * 40,
    });
  }
}

function drawObstacles(ctx) {
  for (const obs of obstacles) {
    ctx.fillStyle = '#555';
    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
    ctx.strokeStyle = '#777';
    ctx.lineWidth = 2;
    ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
    // Grid pattern
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 0.5;
    for (let gx = obs.x + 5; gx < obs.x + obs.w; gx += 5) {
      ctx.beginPath();
      ctx.moveTo(gx, obs.y); ctx.lineTo(gx, obs.y + obs.h); ctx.stroke();
    }
    for (let gy = obs.y + 5; gy < obs.y + obs.h; gy += 5) {
      ctx.beginPath();
      ctx.moveTo(obs.x, gy); ctx.lineTo(obs.x + obs.w, gy); ctx.stroke();
    }
  }
}

function bulletHitsObstacle(bullet) {
  for (const obs of obstacles) {
    if (bullet.x > obs.x && bullet.x < obs.x + obs.w &&
        bullet.y > obs.y && bullet.y < obs.y + obs.h) {
      if (bullet.ricochet && bullet.bounces > 0) {
        // Ricochet: reflect off obstacle edge
        const cx = obs.x + obs.w/2, cy = obs.y + obs.h/2;
        if (Math.abs(bullet.x - cx) / obs.w > Math.abs(bullet.y - cy) / obs.h) {
          bullet.angle = Math.PI - bullet.angle;
        } else {
          bullet.angle = -bullet.angle;
        }
        bullet.bounces--;
        spawnExplosion(bullet.x, bullet.y, 3, '#fa4', '#ff0');
        return false;
      }
      if (!bullet.railgun) {
        spawnExplosion(bullet.x, bullet.y, 4, '#aaa', '#888');
        return true;
      }
    }
  }
  return false;
}

function tankCollidesObstacle(x, y, w, h) {
  for (const obs of obstacles) {
    if (x - w/2 < obs.x + obs.w && x + w/2 > obs.x &&
        y - h/2 < obs.y + obs.h && y + h/2 > obs.y) {
      return true;
    }
  }
  return false;
}

// --- Spawn enemies ---
const enemyTypes = [
  { color: '#d44', turret: '#f66', speed: 0.6, hp: 1, label: 'Scout' },
  { color: '#d84', turret: '#fa8', speed: 0.9, hp: 1, label: 'Fast' },
  { color: '#a4d', turret: '#c6f', speed: 0.5, hp: 2, label: 'Heavy' },
  { color: '#d4a', turret: '#f6c', speed: 0.7, hp: 2, label: 'Elite' },
];

function spawnEnemy() {
  let x, y, safe;
  do {
    safe = true;
    const side = Math.floor(Math.random() * 4);
    if (side === 0) { x = 40; y = Math.random() * H; }
    else if (side === 1) { x = W - 40; y = Math.random() * H; }
    else if (side === 2) { x = Math.random() * W; y = 40; }
    else { x = Math.random() * W; y = H - 40; }
    safe = !tankCollidesObstacle(x, y, 36, 36);
    const pdx = player.x - x, pdy = player.y - y;
    safe = safe && Math.sqrt(pdx*pdx + pdy*pdy) > 80;
  } while (!safe);

  // Chance to spawn elite (increases with level)
  const eliteChance = Math.min(0.35, 0.08 + level * 0.02);
  if (level >= 2 && Math.random() < eliteChance) {
    const maxIdx = Math.min(4, Math.floor((level - 1) / 2));
    const idx = Math.floor(Math.random() * (maxIdx + 1));
    const etype = eliteTypes[idx];
    enemies.push(new EliteEnemy(x, y, etype));
    return;
  }

  const maxIdx = Math.min(3, Math.floor(level / 2));
  const idx = Math.floor(Math.random() * (maxIdx + 1));
  const type = enemyTypes[idx];
  const diff = difficultySettings[currentDifficulty];
  const hp = Math.max(1, type.hp + Math.floor(level / 3) + diff.enemyHpBonus);
  enemies.push(new EnemyTank(x, y, type.color, type.turret, type.speed * diff.enemySpeedMul, hp));
}

// --- Collision detection ---
function checkBulletTankCollisions(bullets, tanks, fromPlayer) {
  for (const bullet of bullets) {
    if (!bullet.alive) continue;
    for (const tank of tanks) {
      if (!tank.alive) continue;
      const dx = bullet.x - tank.x;
      const dy = bullet.y - tank.y;
      if (Math.sqrt(dx * dx + dy * dy) < (bullet.railgun ? 24 : 20)) {
        if (!bullet.railgun) bullet.alive = false;
        const destroyed = tank.hit(bullet);
        if (destroyed && !fromPlayer) {
          // enemy killed by player bullet
        }
        if (!bullet.railgun) break;
      }
    }
    if (bullet.alive && bulletHitsObstacle(bullet)) {
      if (!bullet.ricochet) bullet.alive = false;
    }
  }
}

// --- Ground decoration ---
function drawGround(ctx) {
  // Grid pattern
  ctx.strokeStyle = '#1e1e1e';
  ctx.lineWidth = 0.5;
  for (let x = 0; x < W; x += 30) {
    ctx.beginPath();
    ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 30) {
    ctx.beginPath();
    ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
}

// --- Game Loop ---
function update() {
  if (!gameRunning) return;

  // Update player
  player.update();
  if (!player.alive && !gameOverFlag) {
    lives--;
    if (lives <= 0) {
      endGame();
      return;
    }
    // Respawn
    player = new PlayerTank();
    player.invincible = 120;
  }

  // Update enemies
  for (const enemy of enemies) enemy.update();

  // Update bullets
  for (const b of playerBullets) b.update();
  for (const b of enemyBullets) b.update();

  // Collisions
  checkBulletTankCollisions(playerBullets, enemies, true);
  checkBulletTankCollisions(enemyBullets, [player], false);

  // Cleanup
  playerBullets = playerBullets.filter(b => b.alive);
  enemyBullets = enemyBullets.filter(b => b.alive);
  enemies = enemies.filter(e => e.alive);

  // Spawn enemies
  spawnTimer++;
  const diff = difficultySettings[currentDifficulty];
  const spawnRate = Math.max(40, diff.spawnRate - level * 8);
  const maxEnemies = 3 + level;
  if (spawnTimer >= spawnRate && enemies.length < maxEnemies) {
    spawnTimer = 0;
    spawnEnemy();
  }

  // Increase difficulty
  difficultyTimer++;
  if (difficultyTimer >= 1800) {
    difficultyTimer = 0;
    level++;
    onLevelUp();
    checkAchievements();
    spawnEnemy();
  }

  // Power-up spawn on map
  powerUpSpawnTimer++;
  if (powerUpSpawnTimer >= 600 && powerUps.length < 4) {
    powerUpSpawnTimer = 0;
    const px = 40 + Math.random() * (W - 80);
    const py = 40 + Math.random() * (H - 80);
    spawnPowerUp(px, py);
  }

  // Pickup power-ups
  for (let i = powerUps.length - 1; i >= 0; i--) {
    powerUps[i].life--;
    if (powerUps[i].life <= 0) { powerUps.splice(i, 1); continue; }
    const dx = player.x - powerUps[i].x;
    const dy = player.y - powerUps[i].y;
    if (dx * dx + dy * dy < 30 * 30) {
      applyPowerUp(powerUps[i]);
      powerUps.splice(i, 1);
    }
  }

  // Update buff timers
  for (const key of Object.keys(buffs)) {
    if (buffs[key] > 0) buffs[key]--;
  }

  // Update UI
  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = lives;
  document.getElementById('level').textContent = level;

  // Update particles
  for (const p of particles) p.update();
  particles.length = Math.min(particles.length, 200);
  for (let i = particles.length - 1; i >= 0; i--) {
    if (particles[i].life <= 0) particles.splice(i, 1);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Ground
  drawGround(ctx);

  // Obstacles
  drawObstacles(ctx);

  // Power-ups
  for (const p of powerUps) {
    const t = Date.now() / 1000;
    ctx.save();
    ctx.globalAlpha = 0.7 + Math.sin(t * 3 + p.x) * 0.3;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10 + Math.sin(t * 4) * 4;
    // Glow circle
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
    ctx.fill();
    // Icon
    ctx.font = '16px sans-serif';
    ctx.shadowBlur = 0;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.icon, p.x, p.y);
    ctx.restore();
  }

  // Bullets
  for (const b of playerBullets) b.draw(ctx);
  for (const b of enemyBullets) b.draw(ctx);

  // Enemies
  for (const enemy of enemies) enemy.draw(ctx);

  // Player
  if (player.alive) player.draw(ctx);

  // Particles
  for (const p of particles) {
    if (p.life > 0) p.draw(ctx);
  }

  // Crosshair
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(mouse.x, mouse.y, 8, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(mouse.x - 12, mouse.y); ctx.lineTo(mouse.x + 12, mouse.y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(mouse.x, mouse.y - 12); ctx.lineTo(mouse.x, mouse.y + 12);
  ctx.stroke();
  ctx.fillStyle = '#f00';
  ctx.beginPath();
  ctx.arc(mouse.x, mouse.y, 2, 0, Math.PI * 2);
  ctx.fill();
}

function endGame() {
  gameOverFlag = true;
  gameRunning = false;
  document.getElementById('final-score').textContent = score;
  document.getElementById('game-over').classList.add('visible');
}

function restartGame() {
  score = 0;
  lives = 3;
  level = 1;
  gameRunning = false;
  gameOverFlag = false;
  player = new PlayerTank();
  enemies = [];
  playerBullets = [];
  enemyBullets = [];
  powerUps.length = 0;
  powerUpSpawnTimer = 0;
  buffs = { speed:0, railgun:0, ricochet:0, shield:0, rapid:0, freeze:0, multishot:0 };
  particles.length = 0;
  spawnTimer = 0;
  difficultyTimer = 0;
  document.getElementById('game-over').classList.remove('visible');
  document.getElementById('start-screen').style.display = 'flex';
}

// --- Init ---
function init() {
  loadAchievements();
  player = new PlayerTank();
  gameRunning = false;
  document.getElementById('start-screen').style.display = 'flex';
}

function startGame(difficulty) {
  currentDifficulty = difficulty;
  const diff = difficultySettings[difficulty];
  lives = diff.lives;
  score = 0;
  level = 1;
  gameRunning = true;
  gameOverFlag = false;
  player = new PlayerTank();
  enemies = [];
  playerBullets = [];
  enemyBullets = [];
  powerUps.length = 0;
  powerUpSpawnTimer = 0;
  buffs = { speed:0, railgun:0, ricochet:0, shield:0, rapid:0, freeze:0, multishot:0 };
  particles.length = 0;
  spawnTimer = 0;
  difficultyTimer = 0;
  resetAchievementTracking();
  generateObstacles();
  for (let i = 0; i < 2; i++) spawnEnemy();
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('game-over').classList.remove('visible');
  document.getElementById('lives').textContent = lives;
  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = level;
}

init();

// --- Main Loop ---
function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
